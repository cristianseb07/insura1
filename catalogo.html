<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,700%7CRoboto:300,400,700">
  <title>Catálogo - INSURA</title>
</head>
<body>
  
  <header id="cabecera" class="navbar-scrolled">
    <div class="container-fluid">
      <nav class="navbar navbar-expand-xl px-0">
        <div class="brand-container">
          <a class="navbar-brand" href="index.html"><img src="images/Logo1.png" alt="INSURA Logo"></a>
          
          <div class="header-contact ml-3">
            <a href="mailto:info.insura@gmail.com"><i class="far fa-envelope"></i> info.insura@gmail.com</a>
            <a href="https://wa.me/5493517712327" target="_blank"><i class="fab fa-whatsapp"></i> 351 771-2327</a>
          </div>
        </div>

        <button class="navbar-toggler ml-auto" type="button" data-toggle="collapse" data-target="#navbarToggler"><span class="navbar-toggler-icon"></span></button>

        
        <div class="collapse navbar-collapse" id="navbarToggler">
          <ul class="navbar-nav ml-auto align-items-center">
            <li class="nav-item"><a class="nav-link text-white" href="index.html#faq">Inicio</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="index.html#sobre-mi">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="index.html#precios">Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="catalogo.html" class="active">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="index.html#servicios">Servicios</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="#" data-toggle="modal" data-target="#contactModal">Contacto</a></li>
            <li class="nav-flag d-flex">
              <a href="index.html" class="mx-1"> <img src="images/argentina.png" alt="ES"> </a>
              <a href="indexen.html" class="mx-1"> <img src="images/eeuu.png" alt="EN"> </a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <div class="container py-5" style="min-height: 80vh; padding-top: 150px !important;">
    <div class="text-center mb-5">
      <h2 class="display-4 font-weight-bold">Nuestro Catálogo</h2>
      <div id="filter-container" class="mt-4 mb-2">
        <button class="btn btn-danger filter-btn active rounded-pill px-4" data-filter="all">Todos</button>
      </div>
    </div>
    <div id="catalog-grid" class="row"></div>
  </div>

  <div class="cart-floating" onclick="openCart()">
    <i class="fas fa-shopping-cart"></i>
    <span class="cart-badge" id="cartCount">0</span>
  </div>

  <footer id="pie">
    <div class="container">
      <div class="row align-items-end">
        <div class="col-lg-6 col-md-6 text-left">
          <p class="mb-2 text-white">Córdoba, Argentina</p>
          <a href="https://wa.me/5493517712327" target="_blank" class="text-white d-block mb-1"><i class="fab fa-whatsapp"></i> Charlemos por WhatsApp</a>
          <a href="mailto:info.insura@gmail.com" class="text-white d-block mb-1"><i class="far fa-envelope"></i> info.insura@gmail.com</a>
        </div>
        <div class="col-lg-6 col-md-6 text-md-right mt-4">
          <div class="footer-social mb-3">
            <a href="https://facebook.com" target="_blank" class="mx-2 text-white"><i class="fab fa-facebook fa-2x"></i></a>
            <a href="https://instagram.com" target="_blank" class="mx-2 text-white"><i class="fab fa-instagram fa-2x"></i></a>
            <a href="https://wa.me/5493517712327" target="_blank" class="mx-2 text-white"><i class="fab fa-whatsapp fa-2x"></i></a>
          </div>
          <p class="small mb-0 text-white">©<span id="current-year"></span> INSURA | Todos los derechos reservados</p>
        </div>
      </div>
    </div>
  </footer>

  <div class="modal fade" id="contactModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white"><h5>Contáctanos</h5><button type="button" class="close text-white" data-dismiss="modal">&times;</button></div>
        <form id="contactForm">
          <div class="modal-body text-left">
            <div class="form-group"><label>Nombre</label><input type="text" name="from_name" class="form-control" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="reply_to" class="form-control" required></div>
            <div class="form-group"><label>Mensaje</label><textarea name="message" class="form-control" rows="4" required></textarea></div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-primary btn-block rounded-pill text-white font-weight-bold py-2">Enviar Mensaje</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="cartModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content" style="background: #131926; color: white;">
        <div class="modal-header bg-danger text-white"><h5>Mi Pedido</h5><button type="button" class="close text-white" data-dismiss="modal">&times;</button></div>
        <div class="modal-body">
            <div id="cartItemsList"></div>
            <div class="text-right mt-3"><h5 id="cartTotal"></h5></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-success btn-block rounded-pill" onclick="checkoutCart()">Finalizar por WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="queryModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content" style="background: #131926; color: white;">
        <div class="modal-header bg-info text-white"><h5>Consulta sobre producto</h5><button type="button" class="close text-white" data-dismiss="modal">&times;</button></div>
        <div class="modal-body">
            <div class="form-group"><label>Tu mensaje (puedes editarlo)</label><textarea id="queryMessage" class="form-control" rows="4"></textarea></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-info btn-block rounded-pill text-white font-weight-bold" onclick="sendQueryWA()">Enviar a WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://kit.fontawesome.com/bfb3a5fafc.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem('insuraCart')) || [];
    let currentFilter = 'all';
    const config = window.insuraConfig || {};

    $(document).ready(function() {
      applyConfig(config);
      if (typeof emailjs !== 'undefined' && config.emailjs_public_key) { emailjs.init(config.emailjs_public_key); }
      generateFilters();
      renderCatalog();
      updateCartUI();
      $('#current-year').text(new Date().getFullYear());
      
      $('#contactForm').on('submit', function(e) {
        e.preventDefault();
        if (!config.emailjs_service_id || config.emailjs_service_id === "YOUR_SERVICE_ID") {
            alert('Configura js/config.js'); return;
        }
        const $btn = $(this).find('button[type="submit"]');
        $btn.prop('disabled', true).text('Enviando...');
        emailjs.sendForm(config.emailjs_service_id, config.emailjs_template_id, this)
            .then(() => { alert('¡Enviado!'); $('#contactForm')[0].reset(); $('#contactModal').modal('hide'); })
            .catch(() => { alert('Error. Revisa config.js'); })
            .finally(() => { $btn.prop('disabled', false).text('Enviar Mensaje'); });
      });
    });

    function applyConfig(c) {
        if(!c) return;
        if(c.email_address) {
            $('.header-contact a[href^="mailto:"]').attr('href',`mailto:${c.email_address}`).html(`<i class="far fa-envelope"></i> ${c.email_address}`);
            $('#pie a[href^="mailto:"]').attr('href',`mailto:${c.email_address}`).text(c.email_address);
        }
        if(c.whatsapp_number) {
            const link = `https://wa.me/${c.whatsapp_number}`;
            $('.header-contact a[href*="wa.me"]').attr('href', link).html(`<i class="fab fa-whatsapp"></i> ${c.whatsapp_number}`);
            $('#pie a[href*="wa.me"]').attr('href', link);
            $('.footer-social a[href*="wa.me"]').attr('href', link);
        }
        if(c.facebook_url) $('.footer-social a[href*="facebook"]').attr('href', c.facebook_url);
        if(c.instagram_url) $('.footer-social a[href*="instagram"]').attr('href', c.instagram_url);
        if(c.location_text) $('#pie p.mb-2').text(c.location_text);
    }

    function generateFilters() {
      const cats = [...new Set(window.productsData.map(p => p.category))];
      cats.forEach(c => { $('#filter-container').append(`<button class="btn btn-outline-danger filter-btn m-1 rounded-pill px-4" data-filter="${c}">${c}</button>`); });
      $('.filter-btn').click(function() {
        $('.filter-btn').removeClass('active btn-danger text-white').addClass('btn-outline-danger');
        $(this).addClass('active btn-danger text-white').removeClass('btn-outline-danger');
        currentFilter = $(this).data('filter');
        renderCatalog();
      });
    }

    function renderCatalog() {
      const grid = $('#catalog-grid').empty();
      const filtered = currentFilter === 'all' ? window.productsData : window.productsData.filter(p => p.category === currentFilter);
      filtered.forEach(p => {
        grid.append(`
          <div class="col-lg-4 col-md-6 mb-4" id="product-${p.id}">
            <div class="card h-100 shadow-sm border-0 product-item-card" style="border-radius:15px; background: rgba(28, 36, 56, 0.95); color: white; transition: 0.5s;">
              <div class="card-body text-center d-flex flex-column">
                <img src="${p.image}" class="img-fluid mb-3" style="height: 120px; object-fit: contain;">
                <h6 class="font-weight-bold">${p.name}</h6>
                <p class="text-muted small">${p.description}</p>
                <div class="mt-auto">
                    <p class="text-danger font-weight-bold">${p.priceDisplay}</p>
                    <div class="form-group d-flex justify-content-center align-items-center mb-3">
                        <label class="mr-2 small">Cant:</label>
                        <input type="number" id="qty-${p.id}" class="form-control form-control-sm text-center" value="1" min="1" style="width: 60px; background: #2d3a5a; border: none; color: white;">
                    </div>
                    <button class="btn btn-outline-danger btn-sm btn-block rounded-pill mb-2" onclick="openQueryModal('${p.name}')"><i class="fab fa-whatsapp"></i> Consultar</button>
                    <button class="btn btn-primary btn-sm btn-block rounded-pill" onclick="addToCart(${p.id})">Añadir al carrito</button>
                </div>
              </div>
            </div>
          </div>
        `);
      });

      // Check if there is an ID in the URL to scroll to
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      if (productId) {
          setTimeout(() => {
              const $target = $(`#product-${productId}`);
              if ($target.length) {
                  $('html, body').animate({
                      scrollTop: $target.offset().top - 120
                  }, 800);
                  // Optional: highlight effect
                  $target.find('.product-item-card').css('box-shadow', '0 0 20px #F12639');
                  setTimeout(() => {
                      $target.find('.product-item-card').css('box-shadow', 'none');
                  }, 3000);
              }
          }, 300);
      }
    }


    function addToCart(id) {
      const p = window.productsData.find(x => x.id == id);
      const qty = parseInt($(`#qty-${id}`).val()) || 1;
      cart.push({...p, qty: qty, cartId: Date.now() });
      localStorage.setItem('insuraCart', JSON.stringify(cart));
      updateCartUI();
      alert(`¡Añadido!`);
    }

    function updateCartUI() { 
        $('#cartCount').text(cart.length);
        const list = $('#cartItemsList').empty();
        if (cart.length === 0) { list.append('<p class="text-center py-3 text-white-50">Vasío.</p>'); return; }
        cart.forEach((item, index) => {
            list.append(`
                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 border-secondary">
                    <div><p class="mb-0 font-weight-bold">${item.name} x ${item.qty || 1}</p><small class="text-muted">${item.priceDisplay}</small></div>
                    <button class="btn btn-sm text-danger" onclick="removeFromCart(${index})"><i class="fas fa-trash"></i></button>
                </div>
            `);
        });
    }

    function removeFromCart(index) { cart.splice(index, 1); localStorage.setItem('insuraCart', JSON.stringify(cart)); updateCartUI(); }
    function openCart() { updateCartUI(); $('#cartModal').modal('show'); }
    function checkoutCart() {
        if (cart.length === 0) return alert('Vacío.');
        const phone = config.whatsapp_number || "5493517712327";
        let msg = "Hola INSURA, pedido:\n" + cart.map(i => `- ${i.name} [Cant: ${i.qty || 1}]`).join('\n');
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
    function openQueryModal(productName) { $('#queryMessage').val(`Hola INSURA, consulta: ${productName}.`); $('#queryModal').modal('show'); }
    function sendQueryWA() {
        const phone = config.whatsapp_number || "5493517712327";
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent($('#queryMessage').val())}`, '_blank'); $('#queryModal').modal('hide'); 
    }
  </script>
</body>
</html>
